[package]
name = "ggallery"
version = "0.1.0"
description = "GGallery — a local-first media library"
edition = "2021"
rust-version = "1.77"
# `bin/synth_library.rs` (decision 20's scale-verification tool) added a
# second binary target alongside the app itself. Without this, `cargo run`
# and the Tauri CLI's own build-summary line become ambiguous about which
# binary is "the app" — this is Cargo's standard disambiguation, not a
# Tauri-specific setting.
default-run = "ggallery"

[lib]
name = "gallery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "ico",
] }
webp = "0.3"
kamadak-exif = "0.5"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
num_cpus = "1"
notify = "8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# panic = "abort" is deliberately absent: job workers catch panics so that a
# decoder blowing up on one malformed file costs that file, not the process.
