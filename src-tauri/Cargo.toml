[package]
name = "gallery"
version = "0.1.0"
description = "GGallery — a local-first media library"
edition = "2021"
rust-version = "1.77"
# Tauri's dev/build commands run a bare `cargo run`, which is ambiguous now
# that `reverse_import` is a second binary — pin the app itself as the one
# that resolves by default. `cargo run --bin reverse_import` still reaches
# the reversal tool explicitly.
default-run = "gallery"

[lib]
name = "gallery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The M1.5 reversal tool. Deliberately a separate binary rather than a Tauri
# command: it must still work if the database — or the whole app — is what
# broke. See docs/DESIGN.md#first-import and src/bin/reverse_import.rs.
[[bin]]
name = "reverse_import"
path = "src/bin/reverse_import.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "ico",
] }
webp = "0.3"
kamadak-exif = "0.5"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
num_cpus = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# panic = "abort" is deliberately absent: job workers catch panics so that a
# decoder blowing up on one malformed file costs that file, not the process.
